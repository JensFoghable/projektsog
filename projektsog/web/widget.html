<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Klippe – Projektsøg</title>
  <link rel="icon" href="/assets/icon.png">
  <link rel="stylesheet" href="/widget.css">
  <script src="/widget.js" defer></script>
</head>
<body>
  <main class="pet-app" id="app" data-mood="sleeping" data-outfit="none" data-stage="egg">
    <header class="head">
      <span class="head__name" id="pet-name">Klippe</span>
      <span class="head__level" id="pet-level" title="Vokser med al den tid, du har registreret">Æg</span>
      <span class="head__right">
        <span class="head__streak" id="pet-streak" title="Dage i træk med mindst 1 times arbejde" hidden></span>
        <button type="button" class="head__trophies" id="trophies" title="Trofæer og garderobe" aria-haspopup="dialog">🏆 <span id="trophy-count">0</span></button>
      </span>
    </header>

    <section class="stage" id="stage" aria-label="Klippe">
      <div class="bubble" id="bubble" role="status" aria-live="polite" hidden></div>
      <svg class="pet" id="pet" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <pattern id="stripes" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="skewX(-30)">
            <rect width="11" height="22" fill="var(--stripe-dark)"/>
            <rect x="11" width="11" height="22" fill="var(--stripe-light)"/>
          </pattern>
          <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="var(--aura, var(--accent))" stop-opacity=".35"/>
            <stop offset="100%" stop-color="var(--aura, var(--accent))" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="shades" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1a1440"/>
            <stop offset="55%" stop-color="#6b3fd6"/>
            <stop offset="100%" stop-color="#ff8a3d"/>
          </linearGradient>

          <!-- Klippe's menu (SPEC §18.6), each drawn round (0,0) with its top up: eaten here, held
               as a wardrobe item, dreamt of when hungry and shown in the food tray. Colours are
               attributes, so they also show through <use> anywhere on the page. -->
          <g id="mad-durum">
            <path d="M-8.5 -13 C -9.5 0 -8 10 -6.5 19 L 6.5 19 C 8 10 9.5 0 8.5 -13 Z" fill="#e8c27f" stroke="#b98a45" stroke-width="1.2"/>

            <path d="M-3 -16 l5 -2 l2 3 l-5 2 Z M3 -17 l4 1 l-1 3 l-4 -1 Z" fill="#8a4a24"/>
            <circle cx="-5" cy="-15" r="2.6" fill="#e2483c"/><circle cx="6" cy="-13.5" r="2.2" fill="#e2483c"/>

            <path d="M-9 5 L 9 3 L 7.2 19.5 Q 0 21.5 -7.2 19.5 Z" fill="#dfe3e8" stroke="#98a2ad" stroke-width="1"/>
            <path d="M-5 9 l3 1.5 l3 -1.5 M1 14 l3 -1" fill="none" stroke="#aeb6bf" stroke-width="0.9"/>
          </g>
          <g id="mad-bigmac">
            <path d="M-13 -3 C -13 -12 -6 -14 0 -14 C 6 -14 13 -12 13 -3 Z" fill="#d68a2e" stroke="#a9651b" stroke-width="1"/>
            <path d="M-7 -9 l1.6 -0.8 M-1 -11 l1.6 0 M5 -9 l1.6 0.8 M-4 -6 l1.5 -0.5 M2.5 -6.5 l1.5 0.3 M8 -5.5 l1.2 0.6"

            <path d="M-14 -3.5 h28 l-1.4 3 l-2.6 -1.2 l-2.6 1.5 l-2.6 -1.3 l-2.6 1.5 l-2.6 -1.3 l-2.6 1.5 l-2.6 -1.3 l-2.6 1.5 l-2.6 -1.3 l-2.6 1.3 Z" fill="#6cc04a"/>
            <rect x="-13" y="-0.5" width="26" height="5" rx="2.4" fill="#5a2f17"/>

          </g>

          </g>

              <rect x="-4.5" y="-21" width="3" height="18" rx="0.8"/>
              <rect x="-1" y="-19" width="3" height="16" rx="0.8" transform="rotate(5 0.5 -11)"/>
              <rect x="2.5" y="-22" width="3" height="19" rx="0.8" transform="rotate(-4 4 -12)"/>
              <rect x="5.5" y="-16" width="3" height="13" rx="0.8" transform="rotate(12 7 -10)"/>

            <path d="M-10 15 h20 v1 q 0 3 -3 3 h-14 q -3 0 -3 -3 Z" fill="#a3a9af"/>

            <rect x="-7.5" y="-16" width="2.5" height="32" rx="1.2" fill="#fff" opacity="0.2"/>
          </g>

            <rect x="-8.5" y="-14" width="17" height="19" rx="3" fill="#9be000"

            <text x="0" y="-2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="900" fill="#121416">FK</text>

            <path d="M0 19 v4" stroke="#8fc0d6" stroke-width="1.8"/>
          </g>
          <!-- bites: from the top (durum, fries, nuggets) or from the side (the burger), one per chomp -->
          <mask id="bid-top" maskUnits="userSpaceOnUse" x="-30" y="-30" width="60" height="60">
            <rect x="-30" y="-30" width="60" height="60" fill="#fff"/>
            <g class="bid bid--1" fill="#000"><circle cx="-4" cy="-22" r="6"/><circle cx="5" cy="-21" r="5.5"/></g>
            <g class="bid bid--2" fill="#000"><circle cx="-7" cy="-15" r="6"/><circle cx="1" cy="-14" r="6.5"/><circle cx="8" cy="-15" r="5"/></g>
            <g class="bid bid--3" fill="#000"><circle cx="-6" cy="-7" r="6.5"/><circle cx="3" cy="-6" r="6.5"/><circle cx="10" cy="-7" r="4.5"/></g>
            <g class="bid bid--4" fill="#000"><circle cx="-5" cy="1" r="6.5"/><circle cx="4" cy="2" r="6.5"/><circle cx="11" cy="0" r="4"/></g>
          </mask>
          <mask id="bid-side" maskUnits="userSpaceOnUse" x="-30" y="-30" width="60" height="60">
            <rect x="-30" y="-30" width="60" height="60" fill="#fff"/>
            <g class="bid bid--1" fill="#000"><circle cx="-15" cy="-8" r="5.5"/><circle cx="-16" cy="0" r="6"/><circle cx="-15" cy="8" r="5.5"/></g>
            <g class="bid bid--2" fill="#000"><circle cx="-9" cy="-10" r="5.5"/><circle cx="-10" cy="0" r="6.5"/><circle cx="-9" cy="10" r="5.5"/></g>
            <g class="bid bid--3" fill="#000"><circle cx="-2" cy="-10" r="6"/><circle cx="-3" cy="0" r="6.5"/><circle cx="-2" cy="10" r="6"/></g>
            <g class="bid bid--4" fill="#000"><rect x="2" y="-20" width="20" height="40"/></g>
          </mask>

        <!-- the clapper creature -->

            <path class="awp__stock" d="M112 156 L126 148 L140 148 L140 162 L120 166 Q 112 166 112 160 Z"/>
            <rect class="awp__body" x="138" y="146" width="38" height="11" rx="2"/>
            <rect class="awp__mag" x="150" y="156" width="9" height="11" rx="1.5"/>
            <rect class="awp__barrel" x="176" y="149" width="27" height="4.5" rx="1"/>
            <rect class="awp__brake" x="200" y="147.5" width="6" height="7.5" rx="1"/>
            <rect class="awp__scope" x="144" y="135" width="30" height="8" rx="4"/>
            <circle class="awp__lens" cx="174" cy="139" r="4.5"/>
            <path class="awp__mount" d="M152 143 L152 146 M166 143 L166 146"/>
          </g>
          <g class="haand haand--durum"><use href="#mad-durum" transform="translate(175 150) rotate(14) scale(.9)"/></g>
          <g class="haand haand--pommes"><use href="#mad-pommes" transform="translate(176 153) rotate(6) scale(.9)"/></g>
          <g class="haand haand--booster"><use href="#mad-booster" transform="translate(176 150) rotate(8) scale(.85)"/></g>
          <g class="haand haand--mangoloco"><use href="#mad-mangoloco" transform="translate(176 148) rotate(8) scale(.85)"/></g>
          <!-- the mouth after the hand: a lollipop or a cigarette is never hidden behind the AWP -->
          <g class="mund mund--slikkepind">
            <path class="mund__stick" d="M108 146 L128 160"/>
            <circle cx="132" cy="163" r="9"/>
            <path class="mund__swirl" d="M132 163 m-5 0 a5 5 0 1 0 5 -5 a3 3 0 1 0 -3 3"/>
          </g>
          <g class="mund mund--cigaret">
            <path class="cig__paper" d="M106 147 L134 153"/>
            <path class="cig__filter" d="M106 147 L113 148.5"/>
            <circle class="cig__ember" cx="135" cy="153.2" r="2.8"/>
            <g class="cig__smoke">
              <path d="M137 148 q -4 -6 0 -12 q 4 -6 0 -12"/><path d="M141 146 q -4 -6 0 -12 q 4 -6 0 -12"/>
            </g>
          </g>

          <!-- hungry (SPEC §18.6): it dreams of food, and its stomach growls -->
          <g class="drom">
            <circle class="drom__sky" cx="58" cy="77" r="2.6"/><circle class="drom__sky" cx="50" cy="67" r="3.8"/>
            <path class="drom__sky" d="M22 58 C 11 58 10 44 19 41 C 17 30 31 25 37 31 C 42 23 57 26 55 37 C 64 39 63 56 52 58 Z"/>
            <use class="drom__mad" id="drom-mad" href="#mad-durum" transform="translate(37 43) scale(.56)"/>
          </g>
          <text class="knurr" x="12" y="168">grrr</text>

          <!-- eating: the food flies from the hand to the mouth, is bitten (or drunk), and the rest is thrown away -->
          <g class="mad">
            <g class="mad__flyt">
              <g class="mad__bid" id="mad-bid" mask="url(#bid-top)"><use id="mad-ting" href="#mad-durum"/></g>
            </g>
            <g class="krummer"><circle cx="96" cy="155" r="1.5"/><circle cx="103" cy="157" r="1.2"/><circle cx="108" cy="155" r="1.6"/></g>
            <text class="boevs" x="146" y="112">BØVS!</text>
          </g>
        </g>

        <!-- while a card is transferred: Klippe carries the files from the card to the folder -->
        <g class="carry">
          <g class="carry__card">
            <path d="M10 140 h18 l6 6 v26 a3 3 0 0 1 -3 3 h-21 a3 3 0 0 1 -3 -3 v-29 a3 3 0 0 1 3 -3 z"/>
            <path class="carry__pins" d="M13 140 v6 M18 140 v6 M23 140 v6"/>
          </g>
          <g class="carry__folder">
            <path d="M164 148 h10 l4 4 h14 a3 3 0 0 1 3 3 v18 a3 3 0 0 1 -3 3 h-28 a3 3 0 0 1 -3 -3 v-22 a3 3 0 0 1 3 -3 z"/>
          </g>
          <g class="carry__files">
            <g class="carry__file"><rect x="14" y="146" width="14" height="11" rx="2"/><path d="M16 148 h2 M16 154 h2 M24 148 h2 M24 154 h2"/></g>
            <g class="carry__file"><rect x="14" y="146" width="14" height="11" rx="2"/><path d="M16 148 h2 M16 154 h2 M24 148 h2 M24 154 h2"/></g>
            <g class="carry__file"><rect x="14" y="146" width="14" height="11" rx="2"/><path d="M16 148 h2 M16 154 h2 M24 148 h2 M24 154 h2"/></g>
          </g>
          <g class="carry__glass">
            <circle cx="150" cy="108" r="13"/><path d="M159 118 L172 132"/>
          </g>
          <g class="carry__checks">
            <text x="170" y="140">✓</text><text x="182" y="132">✓</text>
          </g>
        </g>
        <g class="zzz"><text x="150" y="70">z</text><text x="162" y="52">z</text><text x="172" y="34">Z</text></g>
      </svg>
      <div class="hearts" id="hearts" aria-hidden="true"></div>
    </section>

    <p class="mood" id="mood">Sover …</p>

    <section class="messages" id="messages" aria-label="Beskeder" aria-live="assertive" hidden></section>

    <section class="transfer" id="transfer" aria-live="polite" hidden>
      <div class="transfer__row">
        <span class="transfer__title" id="transfer-title"></span>
        <span class="transfer__pct" id="transfer-pct"></span>
      </div>
      <div class="bar bar--transfer"><div class="bar__fill" id="transfer-bar"></div></div>
      <p class="transfer__sub" id="transfer-sub"></p>
    </section>

    <section class="stats">
      <div class="stat">
        <div class="stat__row"><span class="stat__label">I dag</span><span class="stat__value" id="today">0:00</span><span class="stat__goal" id="goal">/ 6 t</span></div>
        <div class="bar"><div class="bar__fill" id="today-bar"></div></div>
      </div>
      <div class="stat">
        <div class="stat__row"><span class="stat__label">Fokus i træk</span><span class="stat__small" id="focus">–</span></div>
        <div class="bar bar--focus"><div class="bar__fill" id="focus-bar"></div></div>
      </div>
      <div class="stat stat--maet" id="hunger" hidden>
        <div class="stat__row">
          <span class="stat__label">Mæthed</span>
          <div class="bar bar--maet" id="maet"><div class="bar__fill" id="maet-bar"></div></div>
          <span class="stat__energi" id="energi" hidden></span>
          <button type="button" class="feed" id="feed" aria-haspopup="dialog" title="Giv Klippe noget at spise eller drikke">🍔 Mad</button>
        </div>
      </div>
      <p class="grow" id="grow"></p>
    </section>
  </main>
  <section class="panel" id="panel" role="dialog" aria-label="Trofæer og garderobe" hidden>
    <header class="panel__head">
      <div class="panel__tabs" role="tablist">
        <button type="button" class="panel__tab" role="tab" data-panel-tab="trophies" aria-selected="true">🏆 Trofæer</button>
        <button type="button" class="panel__tab" role="tab" data-panel-tab="wardrobe" aria-selected="false">👕 Garderobe</button>
      </div>
      <button type="button" class="panel__close" id="panel-close" title="Luk" aria-label="Luk">×</button>
    </header>
    <div class="panel__body" id="panel-body"></div>
    <footer class="panel__foot">
      <button type="button" class="panel__play" id="panel-play">🎮 Lad Klippe lege nu</button>
      <span class="panel__hint">Slip musen bagefter</span>
    </footer>
  </section>
  <section class="tray" id="tray" role="dialog" aria-label="Giv Klippe mad" hidden>
    <header class="tray__head">
      <span class="tray__title">Hvad skal Klippe have?</span>
      <button type="button" class="tray__close" id="tray-close" title="Luk" aria-label="Luk">×</button>
    </header>
    <div class="tray__grid" id="tray-grid"></div>
  </section>
  <canvas class="fx" id="fx" aria-hidden="true"></canvas>
</body>
</html>
